[supervisord]
user=root
nodaemon=true
stderr_logfile=/app/logs/error/supervisor.err.log
stdout_logfile=/app/logs/access/supervisor.log

; --- Infrastructure services (start first) ---

[program:postgres]
command=su postgres -c "postgres -D /app/data/postgres -c listen_addresses=127.0.0.1 -c port=5432"
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/postgres.log
stderr_logfile=/app/logs/error/postgres.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=1

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /app/data/redis --appendonly yes
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/redis.log
stderr_logfile=/app/logs/error/redis.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=1

[program:rabbitmq]
command=su rabbitmq -s /bin/bash -c "RABBITMQ_MNESIA_BASE=/app/data/rabbitmq RABBITMQ_LOG_BASE=/app/logs/access RABBITMQ_NODENAME=rabbit@localhost rabbitmq-server"
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/rabbitmq.log
stderr_logfile=/app/logs/error/rabbitmq.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=1

[program:minio]
command=minio server /app/data/minio --address :9000 --console-address :9001
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/minio.log
stderr_logfile=/app/logs/error/minio.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=MINIO_ROOT_USER="plane",MINIO_ROOT_PASSWORD="planeminio"
priority=1

; --- Plane database migration (runs once, then exits) ---

[program:migrator]
directory=/app/backend
command=bash -c "./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/app/logs/access/migrator.log
stderr_logfile=/app/logs/error/migrator.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=10

; --- Plane application services ---

[program:web]
directory=/app/web
command=node server.js
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/web.log
stderr_logfile=/app/logs/error/web.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PORT="3001",HOSTNAME="0.0.0.0"
priority=15

[program:space]
directory=/app/space/space
command=node server.js
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/space.log
stderr_logfile=/app/logs/error/space.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PORT="3002",HOSTNAME="0.0.0.0"
priority=15

[program:admin]
directory=/app/admin
command=node server.js
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/admin.log
stderr_logfile=/app/logs/error/admin.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PORT="3003",HOSTNAME="0.0.0.0"
priority=15

[program:api]
directory=/app/backend
command=bash -c "./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/api.log
stderr_logfile=/app/logs/error/api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PORT="3004",HOSTNAME="0.0.0.0"
priority=15

[program:worker]
directory=/app/backend
command=bash -c "./bin/docker-entrypoint-worker.sh"
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/worker.log
stderr_logfile=/app/logs/error/worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20

[program:beat]
directory=/app/backend
command=bash -c "./bin/docker-entrypoint-beat.sh"
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/beat.log
stderr_logfile=/app/logs/error/beat.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20

[program:live]
directory=/app/live
command=node live/dist/server.js
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/live.log
stderr_logfile=/app/logs/error/live.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PORT="3005",HOSTNAME="0.0.0.0"
priority=20

[program:openhost-auth]
command=python /app/openhost_auth.py
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/openhost-auth.log
stderr_logfile=/app/logs/error/openhost-auth.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=15

[program:proxy]
command=caddy run --config /app/proxy/Caddyfile
autostart=true
autorestart=true
stdout_logfile=/app/logs/access/proxy.log
stderr_logfile=/app/logs/error/proxy.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=25
