[app]
name = "plane"
version = "0.1.0"
description = "Plane.so project management - all-in-one container with bundled Postgres, Redis, RabbitMQ, and MinIO"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
public_paths = ["/"]
health_check = "/openhost-auth/healthz"

[resources]
memory_mb = 2048
cpu_millicores = 2000

[data]
app_data = true
